<html>

    <!-- stylization and header stuffs -->
    <head>

        <title> Clicker game </title>

        <style>
            body {
                background-color: rgb(1, 64, 34);
                text-align: center;
            }
        </style> 

    </head>
    
    <body>
        <!--Header of game-->
        <h1> Clicker game </h1>
        

        <!--makes button -->
        <button id="clickerButton">Click me!</button>
        <!--number of clicks and shows it -->
        <p>Clicks: <span id="clickcurrent">0</span></p>
        <!--list of advancements -->
        <p> Advancements found out of 5</p>


        <!--hidden advancements -->
        <P id="advancment 1"></P>
        <P id="advancment 2"></P>
        <P id="advancment 3"></P>
        <P id="advancment 4"></P>
        <P id="advancment 5"></P>
        <!--button to reset clicks -->
        <button id="resetButton">Reset</button>

        <!--loads the javascript file -->
        <script src="clicker_code.js"> </script>


    </body>




</html>
